name: Sync accounts and deploy

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install updater dependency
        run: npm install --no-audit --no-fund

      - name: Validate required account secrets
        env:
          KATTIS_USERNAME: ${{ secrets.KATTIS_USERNAME }}
          KATTIS_PASSWORD: ${{ secrets.KATTIS_PASSWORD }}
          LEETCODE_USERNAME: ${{ secrets.LEETCODE_USERNAME }}
        run: |
          test -n "$KATTIS_USERNAME" || { echo 'Missing KATTIS_USERNAME secret.'; exit 1; }
          test -n "$KATTIS_PASSWORD" || { echo 'Missing KATTIS_PASSWORD secret.'; exit 1; }
          test -n "$LEETCODE_USERNAME" || { echo 'Missing LEETCODE_USERNAME secret.'; exit 1; }

      - name: Generate solved-problems JSON
        env:
          KATTIS_USERNAME: ${{ secrets.KATTIS_USERNAME }}
          KATTIS_PASSWORD: ${{ secrets.KATTIS_PASSWORD }}
          LEETCODE_USERNAME: ${{ secrets.LEETCODE_USERNAME }}
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF: ${{ secrets.LEETCODE_CSRF }}
          STRICT_SYNC: '1'
        run: npm run sync

      - name: Validate data
        run: npm test

      - name: Build static files
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
