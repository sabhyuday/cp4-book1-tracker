name: Sync accounts and deploy

on:
  push:
    branches: [main, master]
  schedule:
    # Refresh solved statuses every six hours.
    - cron: '17 */6 * * *'
    # Refresh the CPBook catalogue once a week.
    - cron: '41 3 * * 0'
  workflow_dispatch:
    inputs:
      refresh_catalogue:
        description: 'Refresh every CPBook problem before deploying'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Decide whether to refresh catalogue
        id: catalogue
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          FORCE_REFRESH: ${{ inputs.refresh_catalogue || false }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('data/problems.json', 'utf8'));
          const total = (data.chapters || []).flatMap(c =>
            (c.sections || []).flatMap(s => s.problems || [])
          ).length;
          const bootstrap = total < 500 || data.metadata?.demo === true;
          const weekly = process.env.EVENT_NAME === 'schedule' && process.env.EVENT_SCHEDULE === '41 3 * * 0';
          const forced = process.env.FORCE_REFRESH === 'true';
          const refresh = bootstrap || weekly || forced;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `run=${refresh}\n`);
          console.log(`Catalogue currently has ${total} problems. Refresh: ${refresh}.`);
          NODE

      - name: Refresh complete CPBook catalogue
        if: steps.catalogue.outputs.run == 'true'
        run: npm run scrape

      - name: Verify complete catalogue
        if: steps.catalogue.outputs.run == 'true'
        run: npm run test:full

      - name: Commit refreshed catalogue
        if: steps.catalogue.outputs.run == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/problems.json
          if git diff --cached --quiet; then
            echo 'Catalogue is already current.'
          else
            git commit -m 'chore: refresh CPBook problem catalogue'
            git push
          fi

      - name: Generate solved-problems JSON
        env:
          KATTIS_USERNAME: ${{ secrets.KATTIS_USERNAME }}
          KATTIS_PASSWORD: ${{ secrets.KATTIS_PASSWORD }}
          LEETCODE_USERNAME: ${{ secrets.LEETCODE_USERNAME }}
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF: ${{ secrets.LEETCODE_CSRF }}
          # A missing account is shown as off. A configured account that fails
          # is shown as an error without publishing its identity.
          STRICT_SYNC: '0'
        run: npm run sync

      - name: Validate data
        run: npm test

      - name: Build static files
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
